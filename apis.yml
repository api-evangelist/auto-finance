aid: auto-finance
name: Auto Finance
description: 'Auto Finance is a decentralized finance (DeFi) liquidity-management protocol
  built by Tokemak. Its core product, Autopools, are automated onchain vaults that
  autonomously optimize, rebalance, and auto-compound liquidity-provider yield across
  major DeFi venues (Curve, Fluid, Inverse, Morpho, AAVE) and networks (Ethereum,
  Arbitrum, Base), abstracting away the complexity of manual LP management. The
  protocol is governed and secured through AUTO token staking, and its onchain
  surface is a public set of audited Solidity smart contracts rather than a REST API.
  Documentation is published via GitBook with an agent-readable llms.txt index.'
